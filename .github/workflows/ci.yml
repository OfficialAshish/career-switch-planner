name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: node scripts/smoke-launcher.mjs
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
